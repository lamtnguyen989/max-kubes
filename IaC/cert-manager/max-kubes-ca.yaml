apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: max-kubes-selfsigned-issuer
  spec:
    selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: 
  name: max-kubes-ca
  namespace: cert-manager
spec:
  isCA: true
  duration: "87600h0m0s"  # 10 years
  privateKey:
    algorithm: ECDSA
    size: 256
    issuerRef:
      name: 
      kind: ClusterIssuer
      group: cert-manager.io
    commonName: max-kubes-ca
    secretName: max-kubes-ca-secret
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: max-kubes-ca-issuer
spec:
  ca: 
    secretName: max-kubes-ca-secret
