apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system
spec:
  destination:
    namespace: system-services
    server: https://kubernetes.default.svc
  source:
    path: System_Services
    repoURL: git@github.com:lamtnguyen989/max-kubes.git
    targetRevision: HEAD
    directory:
      recurse: true
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true

