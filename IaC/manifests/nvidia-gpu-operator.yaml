apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-operator
spec:
  destination:
    namespace: nvidia-gpu-operator
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://helm.ngc.nvidia.com/nvidia
      chart: gpu-operator
      targetRevision: 26.7.0
      helm:
        valueFiles:
          - $values/IaC/nvidia-operator/values.yaml
    - repoURL: git@github.com:lamtnguyen989/max-kubes.git
      targetRevision: HEAD
      ref: values
    - repoURL: git@github.com:lamtnguyen989/max-kubes.git
      targetRevision: HEAD
      path: IaC/nvidia-operator
      directory:
        recurse: true
        include: "*.yaml"
        exclude: values.yaml
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
