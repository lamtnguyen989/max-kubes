- chart: intel-device-plugins-operator
  values:
    manager:
      devices:
        dsa: true
        gpu: true
        iaa: true
        qat: true
        sgx: true
        npu: true

- chart: intel-device-plugins-gpu
  values:
    nodeSelector:
      intel.feature.node.kubernetes.io/gpu: "true"
      sharedDevNum: "4"
- chart: intel-device-plugins-npu
  values: 
    nodeSelector:
      intel.feature.node.kubernetes.io/npu: "true"
- chart: intel-device-plugins-qat
  values: 
    nodeSelector:
      intel.feature.node.kubernetes.io/qat: "true"
- chart: intel-device-plugins-dsa
  values: 
    nodeSelector:
      intel.feature.node.kubernetes.io/dsa: "true"
