# PVC claims
persistence:
  config:
    enabled: true
    size: 5Gi
    storageClass: "longhorn"
  media:
    enabled: true
    size: 100Gi
    storageClass: "longhorn"

# Metrics 
metrics:
  enabled: true
  serviceMonitor:
    enabled: true

extraEnvVars:
- name: JELLYFIN_PublishedServerUrl
  value: 'https://jellyfin.max-kubes.com'

