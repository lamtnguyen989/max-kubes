apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jellyfin
spec:
  destination:
    namespace: jellyfin
    server: https://kubernetes.default.svc
  sources:
    - repoURL: https://jellyfin.github.io/jellyfin-helm
      chart: jellyfin
      targetRevision: 3.2.0
      helm:
        valueFiles: 
          - $values/Services/jellyfin/values.yaml
    - path: Services/jellyfin
      repoURL: git@github.com:lamtnguyen989/max-kubes.git
      targetRevision: HEAD
      directory:
        recurse: true
        include: "*.yaml"
        exclude: values.yaml
    - repoURL: git@github.com:lamtnguyen989/max-kubes.git
      targetRevision: HEAD
      ref: values
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
