apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: services
spec:
  destination:
    namespace: ''
    server: https://kubernetes.default.svc
  source:
    path: Services/Services
    repoURL: git@github.com:lamtnguyen989/max-kubes.git
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
